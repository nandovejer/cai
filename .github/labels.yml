# The labels of the repository: name, colour (six hex digits, no #) and description (100 characters at most).
# Issue forms and the pull request template use these names.
- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: accessibility
  color: 0e8a16
  description: Someone cannot use, perceive or understand it
- name: component
  color: 1d76db
  description: A new component or pattern, or a change to one
- name: docs
  color: 0075ca
  description: The documentation site, README or guides
- name: language
  color: 5319e7
  description: A language for the scripts or the home page
- name: tokens
  color: fbca04
  description: Design tokens, modes and themes
- name: needs-browser-review
  color: e99695
  description: Waiting for a review in Safari or Firefox
- name: good first issue
  color: 7057ff
  description: A small, well-defined task to start with
- name: help wanted
  color: 008672
  description: Open to a contribution from anyone
- name: breaking
  color: b60205
  description: Changes a public name, value or behavior
- name: security
  color: ee0701
  description: A security issue; reports go private, not in public issues
- name: wontfix
  color: cfd3d7
  description: Will not be worked on, with the reason in the thread
