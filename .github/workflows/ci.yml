name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  # Reused by publish.yml so a release can never skip these checks
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint CSS & JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CSS
        run: pnpm lint:css

      - name: Lint JS
        run: pnpm lint:js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit (high and above)
        run: pnpm audit --audit-level=high

  build-and-test:
    name: Build, unit tests & tarball contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      # RL-19: llms.txt, the manifests, the examples, the README blocks and the
      # agent snapshot are what the generators write; a stale one fails
      - name: Check the files for AI agents
        run: pnpm check:ai

      # After the build: the dist-dependent suites are skipped without dist/.
      # LUZ_RELEASE: on main (and PRs into it) the red-line debt register
      # must be empty (PRINCIPLES.md, Migration)
      - name: Run unit tests
        run: pnpm test:unit
        env:
          LUZ_RELEASE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

      - name: Check tarball contents
        run: pnpm check:pack

      - name: Check size budgets
        run: pnpm check:size

      - name: Check shipped strings
        run: pnpm check:strings

      # Red line 7: text 4.5:1, focus ring and borders 3:1, three themes
      - name: Check token contrast
        run: pnpm check:contrast

      # Red line 14: docs/ is exactly the output of the Pages build
      - name: Check generated files
        run: pnpm check:generated

      - name: Check exceptions register
        run: pnpm check:exceptions

      # RL-1, RL-13: published packages are MIT with no dependencies; every
      # development dependency has an allowed licence; dev/LICENSES.md is current
      - name: Check licences
        run: pnpm check:license

  test-ui:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    # Runs on every PR and push: the accessibility rules in PRINCIPLES.md are
    # enforced here (axe, no-JS, reduced motion, forced colors, 3 engines)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run UI tests
        run: pnpm test:ui

  # SR-9: a pull request that changes packages/, apps/ or scripts/ carries a
  # `test:` commit that fails on its own on top of the base. The script checks
  # that commit out alone in a worktree of the base and runs its test files,
  # expecting them to fail. Only the `pull_request` event (never the one that runs
  # with the base repository's secrets): the PR's code gets a read-only token and no secrets.
  red-commit:
    name: Red commit (test first)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Prove the test commit fails on the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-red-commit.js "$BASE_SHA" "$HEAD_SHA"

  # Reference screenshots for the visual specs, made on the runner's own image
  # (Chromium on Linux), so they are never compared with a developer's machine.
  # The CI copies are artifacts only, not committed by CI: the job has no write
  # token, and the tree tracks the references of other machines.
  visual-references:
    name: Visual references (Chromium, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Make the reference screenshots
        run: pnpm exec playwright test tests/visual.spec.js --project=chromium --update-snapshots

      # Pinned by commit SHA of the tag v7.0.1 (2026-04-10)
      - name: Upload the references
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-references
          path: |
            tests/visual.spec.js-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
