name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  # Reused by publish.yml so a release can never skip these checks
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint CSS & JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CSS
        run: pnpm lint:css

      - name: Lint JS
        run: pnpm lint:js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit (high and above)
        run: pnpm audit --audit-level=high

  build-and-test:
    name: Build, unit tests & tarball contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      # After the build: the dist-dependent suites are skipped without dist/.
      # CAI_RELEASE: on main (and PRs into it) the red-line debt register
      # must be empty (PRINCIPLES.md, Migration)
      - name: Run unit tests
        run: pnpm test:unit
        env:
          CAI_RELEASE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

      - name: Check tarball contents
        run: pnpm check:pack

      - name: Check size budgets
        run: pnpm check:size

      - name: Check shipped strings
        run: pnpm check:strings

      # Red line 7: text 4.5:1, focus ring and borders 3:1, three themes
      - name: Check token contrast
        run: pnpm check:contrast

      # Red line 14: docs/ is exactly the output of the Pages build
      - name: Check generated files
        run: pnpm check:generated

      - name: Check exceptions register
        run: pnpm check:exceptions

  test-ui:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    # Runs on every PR and push: the accessibility rules in PRINCIPLES.md are
    # enforced here (axe, no-JS, reduced motion, forced colors, 3 engines)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run UI tests
        run: pnpm test:ui
