<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{doctitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/apps/landing/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/apps/landing/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/packages/tokens/dist/cai-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/cai.css">
  <link rel="stylesheet" href="/packages/platform/dist/platform.css">
  <link rel="stylesheet" href="/apps/landing/site-header.css">
  <link rel="stylesheet" href="/apps/docs/reference.css">
</head>
<!-- GitHub Pages serves this page at any missing URL, so its URLs start
     at the site's path (PAGES_BASE in vite.config.js), never relative to
     the page, and no base element: it would send the skip link's
     #main-content to the home page. No script: it never runs code and never
     repeats the URL (security.md SEC-MISC-5). Without a script the color
     mode radios in the footer still work. -->
<body class="o-shell docs-page">
  <a class="cai-platform-skip-link" href="#main-content">Skip to main content</a>

  <!-- cai:include header -->

  <nav class="cai-sidebar page-nav" id="page-nav" popover aria-label="Documentation">
    <!-- cai:include site-links -->
{{nav}}
  </nav>

  <main class="o-main docs-main" id="main-content" tabindex="-1">
{{pagehead}}
  <div class="docs-body">
{{content}}
  </div>
  </main>

  <!-- cai:include footer -->
</body>
</html>
