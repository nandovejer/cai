<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{doctitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/apps/site/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/apps/site/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <link rel="stylesheet" href="/packages/site/dist/site.css">
  <link rel="stylesheet" href="/packages/landing/dist/landing.css">
  <link rel="stylesheet" href="/packages/docs/dist/docs.css">
  <link rel="stylesheet" href="/apps/site/header.css">
  <link rel="stylesheet" href="/apps/docs/reference.css">
</head>
<!-- GitHub Pages serves this page at any missing URL, so its URLs start
     at the site's path (PAGES_BASE in vite.config.js), never relative to
     the page, and no base element: it would send the skip link's
     #main-content to the home page. No script: it never runs code and never
     repeats the URL (security.md SEC-MISC-5). -->
<body class="o-shell luz-docs-shell docs-page docs-page--static">
  <a class="luz-skip-link" href="#main-content">Skip to main content</a>

  <!-- luz:include header -->

  <nav class="luz-sidebar page-nav luz-docs-nav" id="page-nav" popover aria-label="Documentation" tabindex="-1">
    <!-- luz:include site-links -->
{{nav}}
  </nav>

  <main class="o-main luz-docs-main" id="main-content" tabindex="-1">
{{pagehead}}
  <div class="docs-body">
{{content}}
  </div>
  </main>

  <!-- The links of every page; no color mode switcher: its button needs the script -->
  <footer class="docs-footer luz-landing-footer" id="site-footer">
    <div class="o-container o-container--inline o-row">
      <!-- luz:include footer-links -->
    </div>
  </footer>
</body>
</html>
