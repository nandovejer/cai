<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{doctitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="/apps/landing/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/apps/landing/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apps/landing/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/packages/tokens/dist/cai-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/cai.css">
  <link rel="stylesheet" href="/packages/site/dist/site.css">
  <link rel="stylesheet" href="/apps/landing/site-header.css">
  <!-- Before the first paint: the visitor's color mode (EX-009) -->
  <script src="/apps/landing/theme-boot.js"></script>
  <link rel="stylesheet" href="/apps/docs/reference.css">
  <link rel="stylesheet" href="/apps/docs/elements.css">
</head>
<body class="o-shell docs-page">
  <!-- The search dialog comes first: closed, it is not focusable; after
       Ctrl+K with nothing focused, Tab after closing starts at the skip link -->
  <!-- cai:include search -->
  <a class="cai-site-skip-link" href="#main-content">Skip to main content</a>

  <!-- cai:include header -->

  <nav class="cai-sidebar page-nav" id="page-nav" popover aria-label="Documentation" tabindex="-1">
    <!-- cai:include site-links -->
{{nav}}
  </nav>

  <main class="o-main docs-main" id="main-content" tabindex="-1">
{{pagehead}}
{{toc}}
  <div class="docs-body">
{{content}}
{{generated}}
  </div>
{{endnav}}
  </main>

  <!-- cai:include footer -->

  <script type="module" src="/apps/docs/reference.js"></script>
</body>
</html>
