<luz-site-search>
<dialog class="luz-modal luz-site-search" id="luz-search" aria-labelledby="luz-search-title"
        data-luz-search data-luz-search-src="/docs/search-index.json"
        data-luz-label-results="{{t:search.results}}"
        data-luz-label-result="{{t:search.result}}"
        data-luz-label-capped="{{t:search.capped}}"
        data-luz-label-none="{{t:search.none}}"
        data-luz-label-loading="{{t:search.loading}}"
        data-luz-label-error="{{t:search.error}}">
  <search class="luz-site-search__body">
    <div class="luz-site-search__head">
      <h2 class="luz-site-search__title" id="luz-search-title"><label for="luz-search-q">{{t:search.title}}</label></h2>
      <form method="dialog"><button class="luz-btn luz-btn--ghost luz-site-search__close" aria-label="{{t:search.close}}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
    </div>
    <div class="luz-site-search__field">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input class="luz-input" id="luz-search-q" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" autofocus aria-describedby="luz-search-hint">
    </div>
    <p class="luz-field__helper" id="luz-search-hint">{{t:search.hint}}</p>
    <p class="luz-site-search__status" role="status"></p>
    <div class="luz-site-search__results" data-luz-search-results>
      <div data-luz-search-show="idle">
        <h3>{{t:search.popular}}</h3>
        <ul lang="en">
          <li><a href="/docs/get-started/"><span>Install LUZ</span><span>, </span><span>Get started</span></a></li>
          <li><a href="/docs/components/button/"><span>Button</span><span>, </span><span>Components</span></a></li>
          <li><a href="/docs/components/form/"><span>Form fields</span><span>, </span><span>Components</span></a></li>
          <li><a href="/docs/tokens/color/"><span>Color</span><span>, </span><span>Tokens</span></a></li>
          <li><a href="/docs/tokens/modes/"><span>Color modes and themes</span><span>, </span><span>Tokens</span></a></li>
        </ul>
      </div>
      <div hidden><h3>{{t:search.pages}}</h3><ul data-luz-search-list="pages" lang="en"></ul></div>
      <div hidden><h3>{{t:search.sections}}</h3><ul data-luz-search-list="sections" lang="en"></ul></div>
      <div hidden><h3>{{t:search.elements}}</h3><ul data-luz-search-list="elements" lang="en"></ul></div>
    </div>
    <p class="luz-site-search__foot">{{t:search.not-found}} <a href="/docs/a-z/">{{t:search.az}}</a></p>
  </search>
</dialog>
</luz-site-search>
