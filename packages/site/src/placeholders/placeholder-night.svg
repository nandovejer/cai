<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice">
  <!-- CAI image placeholder, night (MIT). A night sky: the same patches in deep blues, blurred into one field. Master of the rasters next to it: edit here, then run `pnpm placeholders:build`, which applies the same blur (stdDeviation, in viewBox units) with ImageMagick. -->
  <filter id="soft" x="-600" y="-600" width="2400" height="2400" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="150"/></filter>
  <g filter="url(#soft)">
    <rect x="-600" y="-600" width="2400" height="2400" fill="#0a1a3a"/>
    <circle cx="-40" cy="960" r="300" fill="#123f73"/>
    <circle cx="1180" cy="1140" r="380" fill="#0d3576"/>
    <circle cx="40" cy="80" r="460" fill="#0f4fc4"/>
    <circle cx="540" cy="860" r="260" fill="#1c3f70"/>
    <circle cx="940" cy="200" r="320" fill="#3d6aa8"/>
  </g>
  <!-- Watermark: the CAI mark once, large and tilted 30°, centred so every crop shows part of it -->
  <g id="watermark" fill="#fff" fill-opacity="0.08">
    <path d="M328 128.9L872 1071.1A544 544 0 0 1 328 128.9ZM649.8 414.2L622.4 -41.1L1003.1 210.2ZM717.8 532L1071.1 328L1343.1 799.1L989.8 1003.1Z"/>
  </g>
</svg>
