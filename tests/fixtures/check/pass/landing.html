<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Summit 2027</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@luz-ds/tokens@0.1.0/dist/luz-tokens.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@luz-ds/core@0.1.0/dist/luz.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@luz-ds/site@0.1.0/dist/site.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@luz-ds/landing@0.1.0/dist/landing.min.css">
</head>
<body class="o-page luz-landing-glow">
  <a class="luz-skip-link" href="#main-content">Skip to content</a>
  <header class="luz-landing-header o-sticky">
    <div class="o-container o-container--inline o-row">
      <a class="luz-landing-header__brand" href="#top">Acme Summit</a>
      <nav class="luz-navbar" aria-label="Main">
        <ul class="luz-navbar__list">
          <li><a class="luz-navbar__link" href="#top" aria-current="page">Programme</a></li>
          <li><a class="luz-navbar__link" href="#top">Tickets</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main-content" class="o-container o-stack luz-landing-main" tabindex="-1">
    <section class="luz-landing-hero o-grid o-grid--split" aria-labelledby="hero-title">
      <div class="luz-landing-hero__copy">
        <p class="luz-landing-hero__eyebrow">12 and 13 May 2027 · Seville</p>
        <h1 class="luz-landing-hero__title" id="hero-title">Acme Summit 2027</h1>
        <p class="luz-landing-hero__lead">Two days of talks and workshops for retail teams.</p>
        <div class="o-actions">
          <a class="luz-btn luz-btn--primary" href="#register">Register</a>
          <a class="luz-btn luz-btn--outline" href="#programme">Programme</a>
        </div>
      </div>
    </section>
    <section class="o-stack luz-landing-section" id="programme" aria-labelledby="programme-title">
      <h2 id="programme-title">Programme</h2>
      <ul class="o-grid o-grid--split">
        <li class="luz-card"><h3 class="luz-card__title">Talks</h3><p class="luz-card__body">Twelve talks on stage.</p></li>
        <li class="luz-card"><h3 class="luz-card__title">Workshops</h3><p class="luz-card__body">Six hands-on workshops.</p></li>
      </ul>
    </section>
  </main>
  <footer class="luz-landing-footer">
    <div class="o-container o-container--inline o-row">
      <p>Acme Summit is a retail event.</p>
    </div>
  </footer>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@luz-ds/core@0.1.0/dist/luz.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@luz-ds/site@0.1.0/dist/site.min.js"></script>
</body>
</html>
