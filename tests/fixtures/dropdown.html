<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
</head>
<body>
  <p><a href="#before" id="before">Before</a></p>
  <div class="luz-dropdown" id="one">
    <button class="luz-btn luz-btn--secondary" type="button" popovertarget="menu-one" id="btn-one">Actions</button>
    <div class="luz-dropdown__menu" id="menu-one" popover>
      <ul class="luz-dropdown__list">
        <li><a class="luz-dropdown__item" href="#edited">Edit</a></li>
        <li><button class="luz-dropdown__item" type="button">Duplicate</button></li>
        <li><button class="luz-dropdown__item luz-dropdown__item--danger" type="button">Delete project</button></li>
      </ul>
    </div>
  </div>
  <div style="margin-block-start: 120px; margin-inline-start: 400px">
    <div class="luz-dropdown" id="two">
      <button class="luz-btn luz-btn--secondary" type="button" popovertarget="menu-two" id="btn-two">More</button>
      <div class="luz-dropdown__menu" id="menu-two" popover>
        <ul class="luz-dropdown__list">
          <li><button class="luz-dropdown__item" type="button">Archive</button></li>
          <li><button class="luz-dropdown__item" type="button" aria-disabled="true">Move</button></li>
        </ul>
      </div>
    </div>
  </div>
  <p id="edited">Edited</p>
</body>
</html>
