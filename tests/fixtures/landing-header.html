<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing header</title>
  <!-- tests/landing-header.spec.js: the landing header with site loaded (its <luz-lang-switch> is a CSS-only tag).
       No site script: the header and the tag have none -->
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <link rel="stylesheet" href="/packages/site/dist/site.css">
  <link rel="stylesheet" href="/packages/landing/dist/landing.css">
</head>
<body class="o-page">
  <header class="luz-landing-header o-sticky" id="hdr">
    <div class="o-container o-container--inline o-row" id="row">
      <button class="luz-nav-toggle" id="toggle" type="button" popovertarget="site-nav" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h18v2H3zM3 11h18v2H3zM3 17h18v2H3z"/></svg>
      </button>
      <a class="luz-landing-header__brand" id="brand" href="#top">Bodega Albar</a>
      <nav class="luz-navbar" id="site-nav" aria-label="Main" popover>
        <ul class="luz-navbar__list">
          <li><a class="luz-navbar__link" href="#top" aria-current="page">Wines</a></li>
          <li><a class="luz-navbar__link" href="#top">The winery</a></li>
          <li><a class="luz-navbar__link" href="#top">Visits</a></li>
          <li><a class="luz-navbar__link" href="#top">Club</a></li>
          <li><a class="luz-navbar__link" href="#top">Journal</a></li>
          <li><a class="luz-navbar__link" href="#top">Contact</a></li>
        </ul>
      </nav>
      <div class="o-row luz-landing-header__actions" id="actions">
        <luz-lang-switch id="lang">
          <button class="luz-lang-switch__button" id="lang-button" type="button" popovertarget="lang-menu"><span class="u-sr-only">Language: </span><span class="luz-lang-switch__name">English</span></button>
          <nav class="luz-lang-switch__menu" id="lang-menu" popover aria-labelledby="lang-title">
            <p class="luz-lang-switch__title" id="lang-title">Language</p>
            <ul class="luz-lang-switch__list">
              <li><a class="luz-lang-switch__link" href="#top" hreflang="en" lang="en" aria-current="page">English</a></li>
              <li><a class="luz-lang-switch__link" href="#top" hreflang="es" lang="es">Español</a></li>
            </ul>
          </nav>
        </luz-lang-switch>
        <a class="luz-btn luz-btn--ghost" id="login" href="#top">Log in</a>
      </div>
    </div>
  </header>
  <main id="top" class="o-container luz-landing-main">
    <h1>Page</h1>
    <p>Something under the bar for the scrim to dim.</p>
    <p style="block-size: 2400px">A tall page, to scroll.</p>
  </main>
</body>
</html>
