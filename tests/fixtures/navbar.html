<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navbar</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <!-- A kind of site's skin on the bare objects (what .luz-landing-header adds): a surface, one row of padding, a divider.
       Its height is --luz-bar-h (a 44px row, 2 x 4px, 1px) -->
  <style>
    .skin { background: var(--luz-surface-page); border-block-end: 1px solid var(--luz-divider); padding-block: var(--luz-space-2xs); }
    .brand { display: inline-flex; align-items: center; min-block-size: var(--luz-control-lg); margin-inline-end: auto; font-weight: 600; text-decoration: none; color: var(--luz-text-primary); }
  </style>
</head>
<body>
  <!-- tests/navbar.spec.js: core's .luz-navbar between a toggle and a bare brand link, in an .o-sticky bar -->
  <header class="o-sticky skin" id="hdr">
    <div class="o-container o-container--inline o-row">
      <button class="luz-nav-toggle" id="toggle" type="button" popovertarget="site-nav" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h18v2H3zM3 11h18v2H3zM3 17h18v2H3z"/></svg>
      </button>
      <a class="brand" id="brand" href="#top">Bodega Albar</a>
      <nav class="luz-navbar" id="site-nav" aria-label="Main" popover>
        <ul class="luz-navbar__list">
          <li><a class="luz-navbar__link" href="#top" aria-current="page">Wines</a></li>
          <li><a class="luz-navbar__link" href="#top">The winery</a></li>
          <li><a class="luz-navbar__link" href="#top">Visits</a></li>
          <li><a class="luz-navbar__link" href="#top">Club</a></li>
          <li><a class="luz-navbar__link" href="#top">Journal</a></li>
          <li><a class="luz-navbar__link" href="#top">Contact</a></li>
        </ul>
      </nav>
      <div class="o-row" id="actions">
        <a class="luz-btn luz-btn--ghost" id="login" href="#top">Log in</a>
      </div>
    </div>
  </header>
  <main id="top">
    <h1>Page</h1>
    <p>Something under the bar for the scrim to dim.</p>
    <!-- The core toggle with its bars, for the forced-colors rule -->
    <button class="luz-nav-toggle" id="bars" type="button" aria-label="Menu"><span class="luz-nav-toggle__bar"></span><span class="luz-nav-toggle__bar"></span><span class="luz-nav-toggle__bar"></span></button>
  </main>
  <footer>
    <nav aria-label="Footer"><ul><li><a href="#top">Privacy</a></li></ul></nav>
  </footer>
</body>
</html>
