<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUZ search element fixture</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <link rel="stylesheet" href="/packages/site/dist/site.css">
</head>
<body>
  <!-- A button outside the element: the chunk shows it when it wires -->
  <button type="button" data-luz-search-open id="external" hidden>Search from here</button>
  <div id="slot"></div>
  <template id="markup">
    <luz-search>
      <a class="luz-search__fallback" id="fallback" href="/a-z/" data-luz-search-fallback>A–Z index</a>
      <button class="luz-search__trigger" id="trigger" type="button" data-luz-search-open aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" hidden>Search</button>
      <dialog class="luz-modal luz-search" data-luz-search data-luz-search-src="/tests/fixtures/search-index.json" aria-label="Search" data-luz-label-loading="Loading" data-luz-label-error="Error" data-luz-label-results="{n} results" data-luz-label-result="1 result">
        <input type="text" aria-label="Query">
        <p role="status"></p>
        <div data-luz-search-results>
          <div hidden><ul data-luz-search-list="pages"></ul></div>
        </div>
      </dialog>
    </luz-search>
  </template>
  <script>
    // The element is added by script, as a router or a framework would
    window.addSearch = () => document.getElementById('slot').append(document.getElementById('markup').content.cloneNode(true));
  </script>
  <script type="module" src="/packages/site/dist/search.js"></script>
</body>
</html>
