  <header class="cai-site-header cai-site-header--sticky" id="hdr">
    <div class="cai-site-header__inner">

        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h18v2H3zM3 11h18v2H3zM3 17h18v2H3z"/></svg>
      </button>
      <a class="cai-site-header__brand" id="brand" href="#top">Bodega Albar</a>
      <nav class="cai-site-header__nav" id="site-nav" aria-label="Main" popover>
        <ul>
          <li><a href="#top" aria-current="page">Wines</a></li>
          <li><a href="#top">The winery</a></li>
          <li><a href="#top">Visits</a></li>
          <li><a href="#top">Club</a></li>
          <li><a href="#top">Journal</a></li>
          <li><a href="#top">Contact</a></li>
        </ul>
      </nav>
      <div class="cai-site-header__actions" id="actions">
        <a class="cai-btn cai-btn--ghost" id="login" href="#top">Log in</a>
      </div>
    </div>
  </header>
