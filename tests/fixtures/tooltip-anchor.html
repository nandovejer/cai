<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUZ tooltip anchor fixture</title>
  <link rel="stylesheet" href="/packages/tokens/dist/luz-tokens.css">
  <link rel="stylesheet" href="/packages/core/dist/luz.css">
  <style>
    body { padding: 0; }
    .row { position: absolute; inset-inline-start: 200px; }
    #top { top: 2px; }
    #middle { top: 300px; }
  </style>
</head>
<body>
  <div class="row" id="top">
    <div class="luz-tooltip">
      <button class="luz-btn luz-btn--outline luz-btn--sm" id="trigger-top" type="button" aria-describedby="tip-top">Archive</button>
      <div class="luz-tooltip__text" role="tooltip" id="tip-top">Hides the project from the list</div>
    </div>
  </div>
  <div class="row" id="middle">
    <div class="luz-tooltip">
      <button class="luz-btn luz-btn--outline luz-btn--sm" id="trigger-middle" type="button" aria-describedby="tip-middle">Archive</button>
      <div class="luz-tooltip__text" role="tooltip" id="tip-middle">Hides the project from the list</div>
    </div>
  </div>
</body>
</html>
